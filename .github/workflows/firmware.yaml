name: Build QMK firmware

"on":
  push:
    branches: [main]
    paths:
      - Makefile
      - qmk.json
      - scripts/link-keyboards.sh
      - keyboards/**
      - layouts/**
      - users/**
      - .github/workflows/firmware.yaml
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: write
    uses: >-
      qmk/.github/.github/workflows/qmk_userspace_build.yml@01daf5113fa50804558f21cc074ab99ba84ddeaf
    with:
      qmk_repo: qmk/qmk_firmware
      qmk_ref: b1aea2556040c28d58d611c8aef0082b5780bb6d
      preparation_command: |
        make update QMK_HOME="$GITHUB_WORKSPACE/qmk_firmware"
