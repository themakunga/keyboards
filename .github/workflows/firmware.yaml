name: Build QMK firmware

"on":
  push:
    branches: [main]
    paths:
      - qmk.json
      - keyboards/**
      - layouts/**
      - users/**
      - .github/workflows/firmware.yaml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targets:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.targets.outputs.enabled }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: targets
        run: echo "enabled=$(jq '.build_targets | length > 0' qmk.json)" >> "$GITHUB_OUTPUT"

  build:
    needs: targets
    if: needs.targets.outputs.enabled == 'true'
    permissions:
      contents: write
    uses: >-
      qmk/.github/.github/workflows/qmk_userspace_build.yml@01daf5113fa50804558f21cc074ab99ba84ddeaf
    with:
      qmk_repo: qmk/qmk_firmware
      qmk_ref: b1aea2556040c28d58d611c8aef0082b5780bb6d
      preparation_command: |
        test ! -e "$GITHUB_WORKSPACE/qmk_firmware/keyboards/themakunga"
        test ! -L "$GITHUB_WORKSPACE/qmk_firmware/keyboards/themakunga"
        ln -s "$GITHUB_WORKSPACE/keyboards/themakunga" \
          "$GITHUB_WORKSPACE/qmk_firmware/keyboards/themakunga"
