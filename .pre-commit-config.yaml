default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]
exclude: ^qmk_firmware/
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
      - id: detect-private-key
      - id: check-merge-conflict
      - id: trailing-whitespace
      - id: end-of-file-fixer
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.37.1
    hooks:
      - id: yamllint
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.9.6
    hooks:
      - id: prettier
        types_or: [json, markdown, yaml]
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.3
    hooks:
      - id: markdownlint-cli2
  - repo: local
    hooks:
      - id: keyboard-setup-tests
        name: Keyboard hierarchy and QMK setup tests
        entry: python3 -m unittest discover -s tests -p test_keyboard_setup.py
        language: system
        files: ^(keyboards/|qmk.json$|scripts/link-keyboards.sh$|tests/test_keyboard_setup.py$)
        pass_filenames: false
      - id: makefile-tests
        name: Makefile build and flash command tests
        entry: python3 -m unittest discover -s tests -p test_makefile.py
        language: system
        files: ^(Makefile|qmk.json|scripts/(setup-qmk|link-keyboards).sh|tests/test_makefile.py)$
        pass_filenames: false
      - id: release-version-tests
        name: Conventional release version tests
        entry: python3 -m unittest discover -s tests -p test_release_version.py
        language: system
        files: ^(scripts/release_version.py|tests/test_release_version.py)$
        pass_filenames: false
      - id: sofle-checks
        name: EVA keyboard, keymap and shared OLED checks
        entry: python3 scripts/check_oled.py
        language: system
        files: ^(keyboards/(sofle|corne)/|users/eva/|scripts/check_oled.py$)
        pass_filenames: false
      - id: eva02-checks
        name: EVA02 hardware, keymap and diagram checks
        entry: python3 scripts/check_eva02.py
        language: system
        files: >-
          ^(keyboards/(sofle|corne)/|qmk.json$|scripts/check_eva02.py$|docs/eva02-layout.svg$)
        pass_filenames: false
      - id: cspell
        name: English and Spanish spelling
        entry: cspell lint --config .cspell.config.yaml --no-progress
        language: node
        additional_dependencies: [cspell@8.19.4, "@cspell/dict-es-es@2.4.0"]
        types: [text]
  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.27.0
    hooks:
      - id: commitlint
        additional_dependencies: ["@commitlint/config-conventional@21.2.2"]
        entry: bash -c 'export NODE_PATH="$(npm root -g)"; exec commitlint --edit "$@"' --
        stages: [commit-msg]
