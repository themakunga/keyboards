version: "0.2"
language: en,es
import:
  - "@cspell/dict-es-es/cspell-ext.json"
dictionaries:
  - en_US
  - softwareTerms
  - cpp
  - bash
  - filetypes
words:
  - qmk
  - keymap
  - keymaps
  - themakunga
  - yamllint
  - commitlint
  - sofle
  - nicolas
  - caterina
  - keyhive
  - dancarroll
  - Incandenza
  - pixelbenny
  - obosob
  - rgblight
  - nkro
  - bksp
  - Wextra
  - Werror
  - EEPROM
  - Adafruit
  - DQMK
  - promicro
  - Josef
  - Adamcik
  - ws2812
ignoreRegExpList:
  - '\b(?:KC|MS|RM|MOD|TD|RGB|QMK|DQMK)_[A-Z0-9_]+\b'
ignorePaths:
  - .git
  - .build
  - .cache
  - qmk_firmware
  - node_modules
  - .venv
  - "**/LICENSE"
